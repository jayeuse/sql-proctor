name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-trixie
        env:
          POSTGRES_DB: sql_proctor_test
          POSTGRES_USER: sql_proctor
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/sql-proctor-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/sql-proctor-api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting with Pint
        run: vendor/bin/pint --test

      - name: Run PHPUnit suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sql_proctor_test
          DB_USERNAME: sql_proctor
          DB_PASSWORD: ci-postgres-password
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sql-proctor-ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/sql-proctor-ui/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest component tests
        run: npm test

      - name: Build Next.js app
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-trixie
        env:
          POSTGRES_DB: sql_proctor_test
          POSTGRES_USER: sql_proctor
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sql_proctor_test
      DB_USERNAME: sql_proctor
      DB_PASSWORD: ci-postgres-password

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/sql-proctor-api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: backend/sql-proctor-api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend environment
        working-directory: backend/sql-proctor-api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/sql-proctor-ui/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend/sql-proctor-ui
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: frontend/sql-proctor-ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: frontend/sql-proctor-ui
        run: npm run test:e2e
